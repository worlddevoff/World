<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Experiment">
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="45%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#2dd4bf" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- void tile -->
  <rect width="64" height="64" rx="14" fill="#040507"/>
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>

  <!-- neural links -->
  <g stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="1.6" stroke-linecap="round" fill="none">
    <line x1="32" y1="32" x2="18" y2="20"/>
    <line x1="32" y1="32" x2="46" y2="22"/>
    <line x1="32" y1="32" x2="48" y2="40"/>
    <line x1="32" y1="32" x2="20" y2="44"/>
    <line x1="18" y1="20" x2="46" y2="22"/>
    <line x1="48" y1="40" x2="20" y2="44"/>
  </g>

  <!-- core organism -->
  <circle cx="32" cy="32" r="9" fill="url(#core)"/>
  <circle cx="32" cy="30.5" r="3.2" fill="#e0fffa" fill-opacity="0.55"/>

  <!-- satellite nodes -->
  <circle cx="18" cy="20" r="3.2" fill="#5eead4"/>
  <circle cx="46" cy="22" r="2.8" fill="#38bdf8"/>
  <circle cx="48" cy="40" r="3" fill="#2dd4bf"/>
  <circle cx="20" cy="44" r="2.6" fill="#5eead4"/>
</svg>
